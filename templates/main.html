<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Formula Assistant</title>
    <style>
        /* 🌙 优化版暗黑模式 */
        .dark-mode {
            background-color: #1e1e1e;
            /* 深灰而非纯黑，护眼 */
            color: #e6e6e6;
            /* 柔和的浅灰文字 */
        }

        /* 暗黑模式下的容器样式 */
        .dark-mode .container {
            background-color: #2c2c2c;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.6);
        }

        /* 输入框样式调整 */
        .dark-mode input[type="number"],
        .dark-mode input[type="text"] {
            background-color: #3a3a3a;
            color: #e6e6e6;
            border: 1px solid #555;
        }

        .dark-mode input::placeholder {
            color: #999;
        }

        /* 按钮样式（绿色改为深灰/亮绿风格） */
        .dark-mode input[type="submit"],
        .dark-mode button {
            background-color: #4CAF50;
            border: none;
            color: #fff;
        }

        .dark-mode input[type="submit"]:hover,
        .dark-mode button:hover {
            background-color: #66bb6a;
        }

        /* 链接按钮 */
        .dark-mode a {
            color: #90caf9;
        }

        /* 按钮浮动样式调整 */
        button.dark-toggle {
            background-color: #4CAF50;
            color: white;
        }

        button.dark-toggle:hover {
            background-color: #66bb6a;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px;
        }

        input[type="number"],
        input[type="submit"],
        input[type="text"] {
            padding: 10px;
            margin: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #45a049;
        }

        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #eef;
            border: 1px solid #99c;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            color: #222;
        }
    </style>
</head>

<script>
    function toggleDarkMode() {
        document.body.classList.toggle("dark-mode");
        // 记住用户选择，下次刷新也保持
        localStorage.setItem("dark-mode", document.body.classList.contains("dark-mode"));
    }

    window.onload = function () {
        if (localStorage.getItem("dark-mode") === "true") {
            document.body.classList.add("dark-mode");
        }
    }
</script>

<body>
    <div class="container">
        <h2>Physics Formula Assistant</h2>

        <h3>Pendulum Period</h3>
        <form action="/pendulum" method="post">
            <input type="number" step="0.01" name="L" placeholder="Length L (m)" value="{{ L or '' }}" required>
            <input type="number" step="0.01" name="g" placeholder="Gravity g (m/s^2)" value="{{ g or 9.8 }}" required>
            <input type="submit" value="Calculate T">
        </form>

<h3>Pendulum Period Graph</h3>
<form action="/pendulum_graph" method="post">
    <input type="number" step="0.01" name="g" placeholder="Gravity g (m/s^2)" value="9.8" required>
    <input type="submit" value="Generate Graph">
</form>

        <h3>Generate Pendulum Data Table</h3>
<form action="/pendulum_table" method="post">
    <input type="number" step="0.01" name="g" placeholder="Gravity g (m/s²)" value="9.8" required>
    <input type="submit" value="Generate Table">
</form>

        <h3>SUVAT Equation (s = ut + 0.5at²)</h3>
        <form action="/suvat" method="post">
            <input type="number" step="0.01" name="u" placeholder="Initial velocity u (m/s)" value="{{ u or '' }}"
                required>
            <input type="number" step="0.01" name="a" placeholder="Acceleration a (m/s^2)" value="{{ a or '' }}"
                required>
            <input type="number" step="0.01" name="t" placeholder="Time t (s)" value="{{ t or '' }}" required>

            <input type="submit" value="Calculate s">
        </form>

        <h3>Ohm's Law</h3>
        <form action="/ohm" method="post">
            <input type="number" step="0.01" name="V" placeholder="Voltage V (V)" value="{{ V or '' }}" required>
            <input type="number" step="0.01" name="R" placeholder="Resistance R (Ω)" value="{{ R or '' }}" required>
            <input type="submit" value="Calculate Current I">
        </form>

        <h3>Ask a free question (Gemini API)</h3>
        <form action="/makersuite_gen" method="post">
            <input type="text" name="q" placeholder="Enter your physics question">
            <input type="submit" value="Ask Gemini">
        </form>

        <h3>Physics Formula Library</h3>
        <form action="/formulas" method="get">
            <input type="submit" value="View Formula Library">
        </form>

        {% if r %}
        <div class="result">
            {{ r }}
        </div>
        {% endif %}
    </div>
    <button class="dark-toggle" onclick="toggleDarkMode()">🌙 暗黑模式</button>
</body>

</html>
